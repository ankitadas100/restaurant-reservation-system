<section class="reservation-page">

  <!-- Header -->
  <div class="reservation-header">
    <p>TABLEFLOW</p>
    <h1>Reserve Your Table</h1>
    <span>Book your table and enjoy an unforgettable dining experience.</span>
  </div>


  <!-- Reservation Form -->
  <div class="reservation-card">

    <h2>Guest Information</h2>

    <div class="form-grid">

      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          placeholder="Enter your name"
          [(ngModel)]="name">
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input
          type="tel"
          placeholder="Enter your phone number"
          [(ngModel)]="phone">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          placeholder="Enter your email"
          [(ngModel)]="email">
      </div>

      <div class="form-group">
        <label>Number of Guests</label>
        <input
          type="number"
          min="1"
          [(ngModel)]="guests">
      </div>

      <div class="form-group">
        <label>Date</label>
        <input
          type="date"
          [(ngModel)]="date">
      </div>

      <div class="form-group">
        <label>Time</label>
        <input
          type="time"
          [(ngModel)]="time">
      </div>

    </div>

    <div class="form-group full-width">
      <label>Special Request</label>

      <textarea
        placeholder="Any special request?">
      </textarea>
    </div>

  </div>


  <!-- Confirm -->
  <div class="confirm-section">

    <button
      class="confirm-btn"
      (click)="confirmReservation()">
      Confirm Reservation
    </button>

  </div>

</section>
